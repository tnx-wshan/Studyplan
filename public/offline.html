<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>홈스터디 · 오프라인</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff8ef; color: #2d2a32; text-align: center; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #17151f; color: #f4f1fa; } }
      h1 { color: #ff8a3d; }
      button { font: inherit; padding: 10px 20px; border: 0; border-radius: 16px; background: #ff8a3d; color: #fff; box-shadow: 0 4px 0 #d9661c; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되지 않았어요</h1>
      <p>연결되면 다시 시도해 주세요. 펫이 기다리고 있어요!</p>
      <button onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
